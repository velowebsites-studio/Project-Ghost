<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Protocol - Command Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --text-primary: #e0e0e0;
            --accent-green: #00ff41;
            --accent-red: #ff4141;
            --accent-blue: #4a9eff;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Orbitron', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .command-center {
            display: grid;
            grid-template-columns: 250px 1fr 300px;
            grid-template-rows: 60px 1fr;
            gap: 10px;
            height: 100vh;
            padding: 10px;
            background: linear-gradient(145deg, var(--bg-primary), var(--bg-secondary));
        }

        header {
            grid-column: 1 / -1;
            background-color: var(--bg-tertiary);
            border-bottom: 2px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        header h1 {
            color: var(--accent-green);
            font-size: 1.8em;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 0 10px var(--accent-green);
        }

        .sidebar {
            background-color: var(--bg-tertiary);
            border-right: 1px solid var(--accent-green);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar h2 {
            color: var(--accent-blue);
            border-bottom: 1px solid var(--accent-blue);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            overflow: hidden;
        }

        .panel {
            background-color: var(--bg-tertiary);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            position: relative;
        }

        .panel h3 {
            color: var(--accent-green);
            margin-top: 0;
            border-bottom: 1px solid var(--accent-green);
            padding-bottom: 5px;
        }

        .right-bar {
            background-color: var(--bg-tertiary);
            border-left: 1px solid var(--accent-green);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .right-bar h2 {
            color: var(--accent-red);
            border-bottom: 1px solid var(--accent-red);
            padding-bottom: 10px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent-green);
            font-size: 0.9em;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--accent-green);
            border-radius: 4px;
            color: var(--text-primary);
            box-sizing: border-box;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background-color: var(--accent-green);
            color: var(--bg-primary);
        }
        .btn-primary:hover { background-color: #00cc33; }

        .btn-danger {
            background-color: var(--accent-red);
            color: var(--text-primary);
        }
        .btn-danger:hover { background-color: #cc0000; }

        .output-log {
            background-color: var(--bg-secondary);
            border: 1px solid #555;
            border-radius: 4px;
            padding: 10px;
            height: 200px;
            overflow-y: scroll;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
        }

        .target-list {
            list-style: none;
            padding: 0;
        }

        .target-list li {
            background-color: var(--bg-secondary);
            padding: 10px;
            border-left: 3px solid var(--accent-blue);
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .target-list li:hover {
            background-color: #333;
        }

        .target-list li.active {
            background-color: #444;
            border-left-color: var(--accent-green);
        }

        .map-placeholder {
            width: 100%;
            height: 100%;
            background: url('https://via.placeholder.com/400x300/1a1a1a/00ff41?text=TARGET+MAP') no-repeat center center;
            background-size: cover;
            border-radius: 5px;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .status-online { background-color: var(--accent-green); }
        .status-offline { background-color: var(--accent-red); }
        .status-unknown { background-color: #888; }

    </style>
</head>
<body>

    <div class="command-center">
        <header>
            <h1><i class="fas fa-satellite-dish"></i> GHOST PROTOCOL</h1>
        </header>

        <nav class="sidebar">
            <h2>Active Targets</h2>
            <ul id="target-list" class="target-list">
                <!-- Targets will be added here -->
            </ul>
            <button id="add-target-btn" class="btn btn-primary"><i class="fas fa-plus"></i> Add Target</button>
        </nav>

        <main class="main-content">
            <section id="profile-panel" class="panel">
                <h3><i class="fas fa-user-ninja"></i> Profile Analysis</h3>
                <div id="profile-output" class="output-log">
                    <p>No target selected. Add a target to begin.</p>
                </div>
            </section>

            <section id="network-panel" class="panel">
                <h3><i class="fas fa-network-wired"></i> Network Topology</h3>
                <div id="network-output" class="output-log">
                    <p>No target selected.</p>
                </div>
            </section>

            <section id="timeline-panel" class="panel">
                <h3><i class="fas fa-clock"></i> Mission Timeline</h3>
                <div id="timeline-output" class="output-log">
                    <p>No objective set.</p>
                </div>
            </section>

            <section id="map-panel" class="panel">
                <h3><i class="fas fa-map-marked-alt"></i> Geospatial View</h3>
                <div class="map-placeholder"></div>
            </section>
        </main>

        <aside class="right-bar">
            <h2>Control & Comms</h2>
            <div class="form-group">
                <label for="quick-recon">Quick Recon</label>
                <input type="text" id="quick-recon" placeholder="Username, IP, or Domain">
            </div>
            <button id="quick-recon-btn" class="btn btn-primary"><i class="fas fa-search"></i> Run</button>
            
            <hr style="margin: 20px 0; border: 1px solid #555;">

            <h3>System Log</h3>
            <div id="system-log" class="output-log">
                <p>[SYSTEM] Command Center online. All systems nominal.</p>
            </div>
            <button id="clear-log-btn" class="btn btn-danger">Clear Log</button>
        </aside>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const targetList = document.getElementById('target-list');
            const addTargetBtn = document.getElementById('add-target-btn');
            const profileOutput = document.getElementById('profile-output');
            const networkOutput = document.getElementById('network-output');
            const timelineOutput = document.getElementById('timeline-output');
            const quickReconInput = document.getElementById('quick-recon');
            const quickReconBtn = document.getElementById('quick-recon-btn');
            const systemLog = document.getElementById('system-log');
            const clearLogBtn = document.getElementById('clear-log-btn');

            let activeTarget = null;
            let targets = [];

            // --- System Logging ---
            function log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement('p');
                logEntry.textContent = `[${timestamp}] ${message}`;
                if (type === 'error') logEntry.style.color = 'var(--accent-red)';
                if (type === 'success') logEntry.style.color = 'var(--accent-green)';
                systemLog.appendChild(logEntry);
                systemLog.scrollTop = systemLog.scrollHeight;
            }

            // --- Target Management ---
            function renderTargets() {
                targetList.innerHTML = '';
                targets.forEach(target => {
                    const li = document.createElement('li');
                    li.textContent = `${target.name} (${target.type})`;
                    li.dataset.id = target.id;
                    if (activeTarget && activeTarget.id === target.id) {
                        li.classList.add('active');
                    }
                    li.addEventListener('click', () => selectTarget(target.id));
                    targetList.appendChild(li);
                });
            }

            function selectTarget(id) {
                activeTarget = targets.find(t => t.id === id);
                renderTargets();
                if (activeTarget) {
                    log(`Target '${activeTarget.name}' selected.`);
                    updateMainPanels();
                }
            }
            
            function addTarget() {
                const name = prompt('Enter target identifier (e.g., John Doe, example.com):');
                if (!name) return;
                const type = prompt('Enter target type (user, domain, ip):');
                if (!type || !['user', 'domain', 'ip'].includes(type)) return;

                const newTarget = {
                    id: Date.now(),
                    name: name,
                    type: type,
                    data: null
                };
                targets.push(newTarget);
                renderTargets();
                log(`New target '${name}' added.`, 'success');
                selectTarget(newTarget.id);
            }

            // --- Main Panel Updates ---
            function updateMainPanels() {
                if (!activeTarget) return;

                // Profile Panel
                profileOutput.textContent = `[PROFILE RECON FOR: ${activeTarget.name}]\n`;
                profileOutput.textContent += `> Type: ${activeTarget.type}\n`;
                profileOutput.textContent += `> Status: Awaiting deep scan...\n`;
                // In a real app, you'd call the liveRecon function from the previous module here.
                // For now, we simulate it.
                setTimeout(() => {
                    profileOutput.textContent += `\n> SCAN COMPLETE.\n`;
                    if(activeTarget.type === 'user') profileOutput.textContent += `> Found 3 social profiles.\n> Behavioral analysis: High privacy awareness.\n`;
                    if(activeTarget.type === 'domain') profileOutput.textContent += `> WHOIS: Registered with GoDaddy.\n> DNS: Points to AWS servers.\n`;
                    if(activeTarget.type === 'ip') profileOutput.textContent += `> GEO: New York, USA (ISP: Verizon).\n> HOST: Likely a residential connection.\n`;
                }, 1500);

                // Network Panel
                networkOutput.textContent = `[NETWORK ANALYSIS FOR: ${activeTarget.name}]\n`;
                networkOutput.textContent += `> Pinging host...\n`;
                setTimeout(() => {
                    networkOutput.textContent += `> Host is ONLINE.\n> Open Ports: 22 (SSH), 80 (HTTP), 443 (HTTPS).\n`;
                }, 1000);

                // Timeline Panel
                timelineOutput.textContent = `[MISSION TIMELINE: ${activeTarget.name}]\n`;
                timelineOutput.textContent += `> Objective: Surveillance.\n`;
                timelineOutput.textContent += `> Phase 1: Establish digital profile. [COMPLETE]\n`;
                timelineOutput.textContent += `> Phase 2: Map physical network. [IN PROGRESS]\n`;
                timelineOutput.textContent += `> Phase 3: Identify patterns. [PENDING]\n`;
            }

            // --- Event Listeners ---
            addTargetBtn.addEventListener('click', addTarget);
            quickReconBtn.addEventListener('click', () => {
                const query = quickReconInput.value;
                if (!query) {
                    log('Quick Recon requires input.', 'error');
                    return;
                }
                log(`Running Quick Recon on: ${query}`);
                // This would trigger the same logic as adding a target and running the scan
                profileOutput.textContent = `[QUICK RECON: ${query}]\n> Running scan...`;
                 setTimeout(() => {
                    profileOutput.textContent += `\n> SCAN COMPLETE.\n> Public data found for query.\n`;
                }, 1500);
            });

            clearLogBtn.addEventListener('click', () => {
                systemLog.innerHTML = '<p>[SYSTEM] Log cleared.</p>';
            });

            // --- Initial State ---
            log('Command Center initialized. Awaiting directives.');

        });
    </script>
</body>
</html>
