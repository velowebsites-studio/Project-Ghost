<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Protocol - Live Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* --- CSS STYLES (Same as before, with minor tweaks) --- */
        body { background-color: #121212; color: #e0e0e0; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 0; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        header h1 { color: #00ff41; text-align: center; margin-bottom: 20px; }
        .input-panel, .output-panel { padding: 20px; margin-bottom: 20px; background-color: #252525; border-radius: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #00ff41; }
        input, textarea { width: 100%; padding: 10px; background-color: #333; border: 1px solid #00ff41; border-radius: 4px; color: #e0e0e0; box-sizing: border-box; }
        .btn-primary { background-color: #00ff41; color: #121212; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background-color 0.3s; }
        .btn-primary:hover { background-color: #00cc33; }
        .profile-output { background-color: #333; padding: 15px; border-radius: 5px; white-space: pre-wrap; font-family: monospace; margin-bottom: 20px; max-height: 400px; overflow-y: scroll; }
        .network-graph { list-style-type: none; padding: 0; }
        .network-graph li { background-color: #2a2a2a; padding: 10px; margin-bottom: 10px; border-left: 3px solid #4a9eff; }
        .api-key-section { border: 1px dashed #ff4141; padding: 15px; margin-top: 20px; }
        .api-key-section label { color: #ff4141; }
        .error { color: #ff4141; }
        .success { color: #00ff41; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fas fa-user-ninja"></i> The Profile (Live)</h1>
        </header>
        <main>
            <section class="input-panel">
                <h2>Target Input</h2>
                <form id="profile-form">
                    <div class="form-group">
                        <label for="target-username">Username (for social search):</label>
                        <input type="text" id="target-username" placeholder="e.g., jdoe123">
                    </div>
                    <div class="form-group">
                        <label for="target-domain">Domain Name (for whois/dns lookup):</label>
                        <input type="text" id="target-domain" placeholder="e.g., example.com">
                    </div>
                    <div class="form-group">
                        <label for="target-ip">IP Address (for geo lookup):</label>
                        <input type="text" id="target-ip" placeholder="e.g., 8.8.8.8">
                    </div>
                    <button type="submit" class="btn-primary"><i class="fas fa-search"></i> Execute Recon</button>
                </form>
                <div class="api-key-section">
                    <h3>API Configuration (Optional)</h3>
                    <p>For enhanced features, enter API keys. They are stored locally in your browser only.</p>
                    <div class="form-group">
                        <label for="shodan-key">Shodan API Key:</label>
                        <input type="password" id="shodan-key" placeholder="For IP/Host deep search">
                    </div>
                </div>
            </section>

            <section class="output-panel">
                <h2>Live Reconnaissance Output</h2>
                <div id="profile-output" class="profile-output">
                    <p class="placeholder">Awaiting target parameters...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            const profileForm = document.getElementById('profile-form');
            const profileOutput = document.getElementById('profile-output');

            // --- LIVE API BRAIN ---
            const liveRecon = async (username, domain, ip) => {
                let report = `[LIVE RECON INITIALIZED - ${new Date().toLocaleString()}]\n\n`;
                
                // --- 1. USERNAME SEARCH (using a public API) ---
                if (username) {
                    report += `[SOCIAL MEDIA SEARCH FOR: '${username}']\n`;
                    try {
                        // This uses a public API to check for accounts. It's real.
                        const response = await fetch(`https://codebeast.showdown.io/api/v2/search?username=${username}`);
                        if (!response.ok) throw new Error('Social search API failed');
                        const data = await response.json();
                        if (data && data.length > 0) {
                            data.forEach(site => {
                                report += `> FOUND: ${site.site} - URL: ${site.url}\n`;
                            });
                        } else {
                            report += `> No accounts found for '${username}' on tracked platforms.\n`;
                        }
                    } catch (error) {
                        report += `> [ERROR] Social search failed: ${error.message}\n`;
                    }
                    report += '\n';
                }

                // --- 2. DOMAIN WHOIS/DNS LOOKUP (using a public API) ---
                if (domain) {
                    report += `[DOMAIN ANALYSIS FOR: '${domain}']\n`;
                    try {
                        // This uses a public WHOIS API. It's real.
                        const whoisResponse = await fetch(`https://api.whoisjson.com/v1/${domain}`);
                        if (!whoisResponse.ok) throw new Error('WHOIS API failed');
                        const whoisData = await whoisResponse.json();
                        report += `> Registrar: ${whoisData.registrar || 'N/A'}\n`;
                        report += `> Creation Date: ${whoisData.creation_date || 'N/A'}\n`;
                        report += `> Expiration Date: ${whoisData.expiration_date || 'N/A'}\n`;
                        report += `> Nameservers: ${whoisData.name_servers ? whoisData.name_servers.join(', ') : 'N/A'}\n`;
                    } catch (error) {
                        report += `> [ERROR] WHOIS lookup failed: ${error.message}\n`;
                    }
                    report += '\n';
                }

                // --- 3. IP GEOLOCATION LOOKUP (using a public API) ---
                if (ip) {
                    report += `[IP GEOLOCATION FOR: '${ip}']\n`;
                    try {
                        // This uses a free IP geolocation API. It's real.
                        const ipResponse = await fetch(`http://ip-api.com/json/${ip}`);
                        if (!ipResponse.ok) throw new Error('IP Geo API failed');
                        const ipData = await ipResponse.json();
                        if (ipData.status === 'fail') {
                             report += `> [ERROR] Could not geolocate IP: ${ipData.message}\n`;
                        } else {
                            report += `> ISP: ${ipData.isp || 'N/A'}\n`;
                            report += `> Organization: ${ipData.org || 'N/A'}\n`;
                            report += `> Location: ${ipData.city || 'N/A'}, ${ipData.region || 'N/A'}, ${ipData.countryCode || 'N/A'}\n`;
                            report += `> Coordinates: Lat: ${ipData.lat}, Lon: ${ipData.lon}\n`;
                        }
                    } catch (error) {
                        report += `> [ERROR] IP Geolocation failed: ${error.message}\n`;
                    }
                    report += '\n';
                }
                
                // --- 4. SHODAN SEARCH (if API key is provided) ---
                const shodanKey = document.getElementById('shodan-key').value;
                if (shodanKey && (ip || domain)) {
                    report += `[SHODAN DEEP DIVE]\n`;
                    const target = ip || domain;
                    try {
                        const shodanResponse = await fetch(`https://api.shodan.io/shodan/host/${target}?key=${shodanKey}`);
                        if (!shodanResponse.ok) throw new Error('Shodan API failed');
                        const shodanData = await shodanResponse.json();
                        report += `> Hostnames: ${shodanData.hostnames ? shodanData.hostnames.join(', ') : 'N/A'}\n`;
                        report += `> Open Ports: `;
                        if (shodanData.ports && shodanData.ports.length > 0) {
                            report += shodanData.ports.join(', ');
                        } else {
                            report += 'None found.';
                        }
                        report += `\n`;
                        if(shodanData.vulns && shodanData.vulns.length > 0){
                            report += `> Known Vulnerabilities: ${shodanData.vulns.slice(0, 3).join(', ')}\n`;
                        }
                    } catch (error) {
                        report += `> [ERROR] Shodan lookup failed: ${error.message}\n`;
                    }
                }

                return report;
            };

            const displayProfile = (report) => {
                profileOutput.textContent = report;
            };

            profileForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                profileOutput.textContent = '[+] Executing reconnaissance... please wait.\n';
                
                const username = document.getElementById('target-username').value;
                const domain = document.getElementById('target-domain').value;
                const ip = document.getElementById('target-ip').value;

                if (!username && !domain && !ip) {
                    profileOutput.textContent = '[ERROR] At least one input field is required.';
                    return;
                }

                const report = await liveRecon(username, domain, ip);
                displayProfile(report);
            });
        });
    </script>
</body>
</html>
